[package]
name = "infrastructure"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
## Test/dev fixtures (`infrastructure::testing`). Off by default so release
## builds never ship `seed_workspace`/TEST_PASSWORD. Enabled through
## dev-dependencies of crates whose tests need it, and by the cli's
## `testing` feature for `seed-demo`:
##   cargo run -p outreach-cli --features testing -- seed-demo
testing = []

[dependencies]
contracts.workspace = true
domain.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
tracing.workspace = true
async-trait.workspace = true
futures.workspace = true
tokio.workspace = true
sqlx.workspace = true
redis.workspace = true
reqwest.workspace = true
rand.workspace = true
sha2.workspace = true
hmac.workspace = true
argon2.workspace = true
base64.workspace = true
aes-gcm.workspace = true
hex.workspace = true
ammonia.workspace = true
csv.workspace = true
http.workspace = true
ipnetwork.workspace = true
lettre = { version = "0.11.23", default-features = false, features = [
    "builder",
    "smtp-transport",
    "tokio1",
    "tokio1-rustls",
    "webpki-roots",
    "ring",
] }

[dev-dependencies]
axum.workspace = true
tempfile = "3"
# Self dev-dependency: infrastructure's own integration tests need the
# `testing` fixtures even when built standalone (`cargo test -p
# infrastructure`), where no other crate's dev-dep unifies the feature in.
infrastructure = { path = ".", features = ["testing"] }
